name: sonora
description: Sonora - música en streaming
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  dio: ^5.4.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  file_picker: ^8.1.2
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1B1035"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
