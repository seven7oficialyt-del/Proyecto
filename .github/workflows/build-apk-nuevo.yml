name: Build APK (nuevo)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Buscar el proyecto Gradle
        id: find
        run: |
          echo "Archivos del repositorio:"
          find . -path ./.git -prune -o -type f -print | head -50
          S=$(find . -path ./.git -prune -o \( -name settings.gradle.kts -o -name settings.gradle \) -print | head -1)
          if [ -z "$S" ]; then
            echo "::error::No hay settings.gradle.kts en el repositorio. Los archivos del proyecto no se subieron."
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "Proyecto encontrado en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK (debug)
        run: gradle -p "${{ steps.find.outputs.dir }}" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: juego-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
