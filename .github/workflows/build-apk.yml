name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: bash SquirrellySummer/scripts/fetch_ruffle.sh
      - run: gradle -p SquirrellySummer assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SquirrellySummer-apk
          path: SquirrellySummer/app/build/outputs/apk/debug/app-debug.apk
