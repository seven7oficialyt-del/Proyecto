name: Sonora - APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/sonora.yml"
      - "lib/**"
      - "pubspec.yaml"
      - "sonora/lib/**"
      - "sonora/pubspec.yaml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Abrir el zip si lo subiste sin descomprimir
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            unzip -o "${zips[0]}" -x '.github/*' '__MACOSX/*'
            git rm -q -f "${zips[0]}"
            git add -A
            git commit -m "Extraer Sonora del zip"
            git push
          fi

      - name: Buscar la app
        run: |
          if [ -f sonora/pubspec.yaml ]; then
            echo "APP_DIR=sonora" >> "$GITHUB_ENV"
          elif [ -f pubspec.yaml ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::No encuentro la app (pubspec.yaml). Sube sonora.zip al repositorio."
            exit 1
          fi

      - name: Crear llave de firma (solo si no existe)
        run: |
          cd "$APP_DIR"
          if [ ! -f release/sonora.jks ]; then
            mkdir -p release
            keytool -genkeypair -keystore release/sonora.jks -storetype PKCS12 \
              -alias sonora -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass sonora2026 -keypass sonora2026 \
              -dname "CN=Sonora, O=Sonora, C=US"
            git add -f release/sonora.jks
            git commit -m "Llave de firma de Sonora"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compilar y firmar
        run: |
          cd "$APP_DIR"
          flutter create --platforms=android --org com.sonora --project-name sonora .
          rm -rf test
          python3 tools/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons

          build() {
            flutter build apk --release \
              --build-number=${{ github.run_number }} \
              --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.log
            return ${PIPESTATUS[0]}
          }

          ok=0
          for i in 1 2 3; do
            if build; then ok=1; break; fi
            V=$(grep -oE "compile against version [0-9]+" build.log | grep -oE "[0-9]+" | sort -n | tail -1 || true)
            if [ -z "$V" ]; then break; fi
            echo "Subiendo compileSdk a $V y reintentando..."
            sed -i -E "s/compileSdk(Version)?( *=)? *(flutter\.compileSdkVersion|[0-9]+)/compileSdk = $V/" android/app/build.gradle*
          done
          [ "$ok" = 1 ] || exit 1

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release/sonora.jks --ks-key-alias sonora \
            --ks-pass pass:sonora2026 --key-pass pass:sonora2026 \
            --out Sonora.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify Sonora.apk
          echo "APK_PATH=$PWD/Sonora.apk" >> "$GITHUB_ENV"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sonora 1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
