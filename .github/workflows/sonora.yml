name: Sonora - APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "sonora/lib/**"
      - "sonora/pubspec.yaml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar la app
        run: |
          if [ -f sonora/pubspec.yaml ]; then echo "APP_DIR=sonora" >> "$GITHUB_ENV"; else echo "APP_DIR=." >> "$GITHUB_ENV"; fi

      - name: Crear llave de firma (solo la primera vez)
        run: |
          cd "$APP_DIR"
          if [ ! -f release/sonora.jks ]; then
            mkdir -p release
            keytool -genkeypair -keystore release/sonora.jks -storetype PKCS12 \
              -alias sonora -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass sonora2026 -keypass sonora2026 \
              -dname "CN=Sonora, O=Sonora, C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f release/sonora.jks
            git commit -m "Llave de firma de Sonora"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compilar y firmar
        run: |
          cd "$APP_DIR"
          flutter create --platforms=android --org com.sonora --project-name sonora .
          rm -rf test
          python3 tools/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release/sonora.jks --ks-key-alias sonora \
            --ks-pass pass:sonora2026 --key-pass pass:sonora2026 \
            --out Sonora.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify Sonora.apk
          echo "APK_PATH=$PWD/Sonora.apk" >> "$GITHUB_ENV"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sonora 1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
